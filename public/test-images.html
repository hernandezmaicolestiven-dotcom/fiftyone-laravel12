<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Imágenes - FiftyOne</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Test de Imágenes de Productos</h1>
        
        <div id="products" class="grid grid-cols-4 gap-4">
            <p class="col-span-4 text-gray-500">Cargando productos...</p>
        </div>
    </div>

    <script>
        fetch('/api/products')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('products');
                const products = data.data || data;
                
                if (!products || products.length === 0) {
                    container.innerHTML = '<p class="col-span-4 text-red-500">No se encontraron productos</p>';
                    return;
                }
                
                container.innerHTML = products.map(p => `
                    <div class="bg-white rounded-lg shadow p-4">
                        <div class="aspect-square bg-gray-200 rounded mb-2 overflow-hidden">
                            <img src="${p.image || '/storage/products/product_1.jpg'}" 
                                 alt="${p.name}"
                                 class="w-full h-full object-cover"
                                 onerror="this.src='https://via.placeholder.com/400?text=Error'; this.classList.add('border-4', 'border-red-500');">
                        </div>
                        <h3 class="font-semibold text-sm">${p.name}</h3>
                        <p class="text-xs text-gray-500 mt-1">${p.image}</p>
                        <p class="text-purple-600 font-bold mt-2">$${p.price.toLocaleString()}</p>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('products').innerHTML = 
                    `<p class="col-span-4 text-red-500">Error: ${err.message}</p>`;
            });
    </script>
</body>
</html>
