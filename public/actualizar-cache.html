<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizando FiftyOne...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00D4A1 0%, #00B88D 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }
        h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00D4A1, #00B88D);
            width: 0%;
            animation: progress 3s ease-out forwards;
        }
        @keyframes progress {
            to { width: 100%; }
        }
        .status {
            color: #10b981;
            font-size: 14px;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #00D4A1 0%, #00B88D 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0,212,161,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </div>
        
        <h1>Actualizando FiftyOne</h1>
        <p>Estamos limpiando el caché y cargando la última versión...</p>
        
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        
        <div class="status" id="status">Preparando actualización...</div>
        
        <a href="/" class="btn" id="continueBtn" style="display: none;">Continuar a FiftyOne</a>
    </div>

    <script>
        const status = document.getElementById('status');
        const continueBtn = document.getElementById('continueBtn');
        
        let step = 0;
        const steps = [
            'Preparando actualización...',
            'Limpiando caché del navegador...',
            'Descargando última versión...',
            'Aplicando cambios...',
            '✅ ¡Actualización completa!'
        ];
        
        function updateStatus() {
            if (step < steps.length) {
                status.textContent = steps[step];
                step++;
                setTimeout(updateStatus, 600);
            } else {
                // Limpiar caché
                localStorage.clear();
                sessionStorage.clear();
                localStorage.setItem('app_version', '2.3.0');
                localStorage.setItem('cache_cleared', Date.now());
                
                // Mostrar botón
                continueBtn.style.display = 'inline-block';
                
                // Redirigir automáticamente después de 2 segundos
                setTimeout(() => {
                    window.location.href = '/?v=' + Date.now();
                }, 2000);
            }
        }
        
        // Iniciar actualización
        setTimeout(updateStatus, 500);
    </script>
</body>
</html>
