<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Seguro - Wompi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(160deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            width: 120px;
            height: 40px;
            background: linear-gradient(90deg, #00D4A1, #00A87E);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-weight: bold;
            color: white;
            font-size: 18px;
        }
        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .amount-box {
            background: linear-gradient(90deg, rgba(59,89,255,0.15), rgba(123,47,190,0.15));
            border: 1px solid rgba(59,89,255,0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin: 30px 0;
        }
        .amount-label {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .amount {
            color: white;
            font-size: 36px;
            font-weight: bold;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00D4A1;
            background: rgba(255,255,255,0.1);
        }
        input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #3B59FF, #7B2FBE);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59,89,255,0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        .security-badge i {
            color: #00D4A1;
        }
        .info-box {
            background: rgba(0,212,161,0.1);
            border: 1px solid rgba(0,212,161,0.2);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
        }
        .info-box p {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            line-height: 1.6;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">WOMPI</div>
            <h1>🔐 Pago Seguro</h1>
            <p class="subtitle">Completa tu información de pago</p>
        </div>

        <div class="amount-box">
            <div class="amount-label">Total a Pagar</div>
            <div class="amount" id="amount">$0</div>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label>Número de Tarjeta</label>
                <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Fecha de Expiración</label>
                    <input type="text" id="cardExpiry" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" id="cardCvv" placeholder="123" maxlength="4" required>
                </div>
            </div>

            <div class="form-group">
                <label>Nombre en la Tarjeta</label>
                <input type="text" id="cardName" placeholder="JUAN PEREZ" required>
            </div>

            <button type="submit" class="btn" id="payBtn">
                <i class="fa-solid fa-lock"></i> Pagar Ahora
            </button>
        </form>

        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Pago 100% seguro y encriptado</span>
        </div>

        <div class="info-box">
            <p><strong>💳 Tarjeta de prueba:</strong><br>
            4242 4242 4242 4242 | CVV: 123 | Fecha: 12/28</p>
        </div>
    </div>

    <script>
        // Obtener datos del pago
        const paymentData = JSON.parse(sessionStorage.getItem('wompi_payment_data') || '{}');
        
        if (!paymentData.reference) {
            alert('Error: No se encontraron datos del pago');
            window.location.href = '/';
        }

        // Mostrar monto
        const amount = (paymentData.amount / 100).toLocaleString('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0
        });
        document.getElementById('amount').textContent = amount;

        // Formatear número de tarjeta
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
        });

        // Formatear fecha de expiración
        document.getElementById('cardExpiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2, 4);
            }
            e.target.value = value;
        });

        // Solo números en CVV
        document.getElementById('cardCvv').addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Procesar pago
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Procesando...';

            // Simular procesamiento (en producción, aquí se llamaría a la API de Wompi)
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Limpiar datos
            sessionStorage.removeItem('wompi_payment_data');

            // Redirigir a página de éxito
            window.location.href = '/mi-cuenta?payment=success&order=' + paymentData.order_id;
        });
    </script>
</body>
</html>
